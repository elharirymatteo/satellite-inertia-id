# Satellite 3
satellite:
  mass: 118.0
  dimensions: [0.7, 0.8, 1.0]
  inertia_tensor: [10.6, 14.2, 15.3]  # approximate from cuboid I = 1/12*m*(y²+z²), etc.

reaction_wheels:
  enabled: true
  max_torque: 0.1         # Nm (from RW1)
  diameter: 0.14          # m (112 mm)
  max_speed: 1500          # rad/s
  inertia: 0.003          # kg·m² (1.0 Nms / 1000 rad/s)

  alignment_matrix:
    - [1, 0, 0]
    - [0, 1, 0]
    - [0, 0, 1]


sim:
  dt: 1.0
  t_max: 300.0
  initial_omega: [0.0, 0.0, 0.0]
  initial_rw_speed: [0.0, 0.0, 0.0]
